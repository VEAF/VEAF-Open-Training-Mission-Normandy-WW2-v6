  COMBATZONE:
    enabled: true
    combat_zones:
      - type: zone
        zone_name: combatZone_Bocage_Easy
        friendly_name: A1 Mitraillage bocage — facile
        radio_group_name: Entraînement appui rapproché
        training: true
        briefing: "Champ de tir d'appui rapproché dans le bocage du Cotentin, à 6 nm à l'ouest d'Azeville : chars, blindés légers et camions immobiles en tir interdit, dépôts de carburant et casernement. À 11 nm du front, arrière bleu.\nPosition : bullseye 326°/27 nm (N49°30.000' W001°28.200')."
      - type: zone
        zone_name: combatZone_Bocage_Medium
        friendly_name: A2 Mitraillage bocage — moyen
        radio_group_name: Entraînement appui rapproché
        training: true
        includes:
          - combatZone_Bocage_Easy
        briefing: "Champ de tir du bocage : un groupe blindé léger actif et de la flak légère de 20 mm (deux positions tirées au sort sur trois) en plus des cibles du niveau facile.\nPosition : bullseye 326°/27 nm (N49°30.000' W001°28.200')."
