      - type: zone
        zone_name: combatZone_Salisbury_Easy
        friendly_name: B1 Bombardement Salisbury — facile
        radio_group_name: Entraînement bombardement
        training: true
        briefing: "Champ de tir de bombardement de la plaine de Salisbury, à 21 nm de Stoney Cross : bâtiments et véhicules fictifs immobiles en tir interdit (blockhaus, casernes, entrepôts, dépôt, gare). À 111 nm du front : aucun contact possible.\nPosition : bullseye 344°/130 nm (N51°12.000' W001°58.800')."
      - type: zone
        zone_name: combatZone_Salisbury_Medium
        friendly_name: B2 Bombardement Salisbury — moyen
        radio_group_name: Entraînement bombardement
        training: true
        includes:
          - combatZone_Salisbury_Easy
        briefing: "Champ de tir de Salisbury : de la flak légère de 20 mm, deux positions sur trois tirées au sort, en plus des cibles du niveau facile.\nPosition : bullseye 344°/130 nm (N51°12.000' W001°58.800')."
      - type: zone
        zone_name: combatZone_Salisbury_Hard
        friendly_name: B3 Bombardement Salisbury — difficile
        radio_group_name: Entraînement bombardement
        training: true
        includes:
          - combatZone_Salisbury_Medium
        briefing: "Champ de tir de Salisbury avec la flak lourde de l'époque : une batterie de pièces de 88 mm (tirée au sort entre deux positions) et une batterie de 37 mm en plus du niveau moyen.\nPosition : bullseye 344°/130 nm (N51°12.000' W001°58.800')."
      - type: zone
        zone_name: combatZone_Aurigny_Easy
        friendly_name: C1 Antiflak Aurigny — facile
        radio_group_name: Entraînement antiflak
        training: true
        briefing: "Site antiflak du fort Tourgis, à Aurigny, à 1 nm de la piste d'Aurigny et 30 nm de Maupertus : une batterie de flak moyenne (37 mm), à détruire. À 32 nm du front, en territoire rouge.\nPosition : bullseye 308°/58 nm (N49°43.398' W002°14.148')."
      - type: zone
        zone_name: combatZone_Aurigny_Medium
        friendly_name: C2 Antiflak Aurigny — moyen
        radio_group_name: Entraînement antiflak
        training: true
        includes:
          - combatZone_Aurigny_Easy
        briefing: "Site antiflak d'Aurigny : la flak lourde de 88 mm (une batterie sur deux positions) en plus de la batterie de 37 mm.\nPosition : bullseye 308°/58 nm (N49°43.398' W002°14.148')."
      - type: zone
        zone_name: combatZone_Aurigny_Hard
        friendly_name: C3 Antiflak Aurigny — difficile
        radio_group_name: Entraînement antiflak
        training: true
        includes:
          - combatZone_Aurigny_Medium
        briefing: "Site antiflak d'Aurigny en réseau : un radar d'alerte Freya, un radar de conduite de tir Würzburg, un télémètre et deux projecteurs guident la flak lourde et moyenne.\nPosition : bullseye 308°/58 nm (N49°43.398' W002°14.148')."
      - type: zone
        zone_name: combatZone_TourPlages
        friendly_name: T1 Tourisme — Plages du Débarquement
        radio_group_name: Tourisme
        training: true
        completable: false
        briefing: "Visite aérienne « Plages du Débarquement », hors combat, à 3 nm de Longues-sur-Mer. Une balise radio VHF/AM à chaque site (SWD 130.0, GLD 130.5, OMA 131.0, UTH 131.5) ; survolez un monument à moins de 1 500 ft sol et un guide vous le raconte.\nPosition : bullseye 051°/23 nm (N49°21.000' W000°37.200')."
      - type: zone
        zone_name: combatZone_TourCotentin
        friendly_name: T2 Tourisme — Cotentin et Cherbourg
        radio_group_name: Tourisme
        training: true
        completable: false
        briefing: "Visite aérienne « Cotentin et Cherbourg », hors combat, à 2 nm de Maupertus. Une balise radio VHF/AM à chaque site (CHB 133.0, GAT 133.5, VAA 134.0) ; survolez un monument à moins de 1 500 ft sol et un guide vous le raconte.\nPosition : bullseye 334°/33 nm (N49°37.200' W001°27.000')."
      - type: zone
        zone_name: combatZone_TourAngleterre
        friendly_name: T3 Tourisme — Côte sud de l'Angleterre
        radio_group_name: Tourisme
        training: true
        completable: false
        briefing: "Visite aérienne « Côte sud de l'Angleterre », hors combat, à 19 nm de Stoney Cross. Une balise radio VHF/AM à chaque site (NDL 135.0, POR 135.5, BCH 136.0, DVR 136.5) ; survolez un monument à moins de 1 500 ft sol et un guide vous le raconte.\nPosition : bullseye 356°/101 nm (N50°48.000' W001°12.000')."
      - type: zone
        zone_name: combatZone_VillersBocage
        friendly_name: Z01 Front — Villers-Bocage
        radio_group_name: Front
        training: false
