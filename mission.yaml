        training: false
        briefing: "La ligne de défense de la 12e SS Hitlerjugend au nord de Caen, autour de Carpiquet : Panzer IV, Tiger et automoteurs d'artillerie dans les ruines. Détruire les blindés et l'artillerie ; flak moyenne de 37 mm, sous la QRA de Caen.\nPosition : bullseye 079°/27 nm (N49°11.100' W000°24.600'). Base amie la plus proche : Beny-sur-Mer, à 7 nm."
      - type: zone
        zone_name: combatZone_CotentinSud
        friendly_name: Z03 Front — La Haye-du-Puits et Lessay
        radio_group_name: Front
        training: false
        briefing: "La ligne de défense allemande qui bloque le Cotentin, des marais de Lessay à La Haye-du-Puits : canons antichars, blindés légers et artillerie dans le bocage. Détruire les blindés et les canons ; flak moyenne. Aucune QRA ne couvre le Cotentin sud.\nPosition : bullseye 288°/17 nm (N49°12.600' W001°30.000'). Base amie la plus proche : Picauville, à 12 nm."
      - type: zone
        zone_name: combatZone_Antifer
        friendly_name: Z04 Radars — station du cap d'Antifer
        radio_group_name: Flak et radars
        training: false
        briefing: "La station radar du cap d'Antifer, sur la côte au nord du Havre : radar d'alerte avancée Freya et radars de conduite de tir Würzburg, protégés par de la flak lourde. Détruire les radars et réduire la flak.\nPosition : bullseye 053°/60 nm (N49°41.192' E000°09.875'). Base amie la plus proche : Beny-sur-Mer, à 33 nm."
      - type: zone
        zone_name: combatZone_GrisNez
        friendly_name: Z05 Radars — cap Gris-Nez
        radio_group_name: Flak et radars
        training: false
        briefing: "Le cap Gris-Nez, au plus près des côtes anglaises : radars Freya et Würzburg, flak lourde et batterie côtière. Détruire les radars et réduire la flak ; la batterie côtière est une menace pour les navires, pas pour les avions.\nPosition : bullseye 042°/148 nm (N50°52.328' E001°35.023'). Base amie la plus proche : Manston, à 30 nm."
      - type: zone
        zone_name: combatZone_ConvoiFalaise
        friendly_name: Z06 Convoi — Falaise vers Caen
        radio_group_name: Convois
        training: false
        briefing: "Des renforts blindés quittent Falaise par la route de Caen. L'arrêter avant Caen ; deux Sd.Kfz 251 et un Puma l'escortent.\nPosition : bullseye 108°/37 nm (N48°54.745' W000°12.602'). Base amie la plus proche : Beny-sur-Mer, à 25 nm."
      - type: zone
        zone_name: combatZone_ConvoiLisieux
        friendly_name: Z07 Convoi — Lisieux vers Caen
        radio_group_name: Convois
        training: false
        briefing: "Un convoi de ravitaillement roule de Lisieux vers Caen, par la route de Mézidon. Le détruire avant le front ; camions, tracteurs et un Sd.Kfz 251 d'escorte.\nPosition : bullseye 086°/51 nm (N49°08.399' E000°12.533'). Base amie la plus proche : Beny-sur-Mer, à 27 nm."
      - type: zone
        zone_name: combatZone_ConvoiCoutances
        friendly_name: Z08 Convoi — Coutances vers La Haye-du-Puits
        radio_group_name: Convois
        training: false
        briefing: "Des renforts quittent Coutances vers La Haye-du-Puits, le long du front du Cotentin. Les arrêter avant le front ; deux Sd.Kfz 251 et un Puma les escortent.\nPosition : bullseye 256°/15 nm (N49°03.671' W001°28.162'). Base amie la plus proche : Picauville, à 20 nm."
      - type: zone
        zone_name: combatZone_RocheGuyon
        friendly_name: Z09 Frappe — état-major de La Roche-Guyon
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "Le quartier général du groupe d'armées B, dans le château de La Roche-Guyon, au bord de la Seine : bunkers, centre de transmissions, véhicules de commandement. Tout détruire ; flak moyenne et lourde. Hors des cercles de QRA.\nPosition : bullseye 088°/107 nm (N49°05.136' E001°37.650'). Base amie la plus proche : Beny-sur-Mer, à 82 nm."
      - type: zone
        zone_name: combatZone_TriageArgentan
        friendly_name: Z10 Frappe — gare de triage d'Argentan
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "La gare de triage d'Argentan, nœud ferroviaire qui alimente le front de Normandie : gare, entrepôts, réservoirs de carburant. Tout détruire ; flak moyenne.\nPosition : bullseye 116°/48 nm (N48°44.730' W000°00.900'). Base amie la plus proche : Beny-sur-Mer, à 37 nm."
      - type: zone
        zone_name: combatZone_Eperlecques
        friendly_name: Z11 Frappe — blockhaus d'Éperlecques
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "Le blockhaus d'Éperlecques, près de Saint-Omer : un énorme bunker de béton destiné au lancement des fusées V2, bâti en 1943 et déjà bombardé. Détruire le blockhaus et ses annexes ; flak lourde et moyenne, sous la QRA du Pas-de-Calais.\nPosition : bullseye 048°/160 nm (N50°48.498' E002°05.982'). Base amie la plus proche : Manston, à 43 nm."
      - type: zone
        zone_name: combatZone_DepotLisieux
        friendly_name: Z12 Frappe — dépôts d'essence de Lisieux
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "Un dépôt de carburant de l'arrière du front, près de Lisieux (position illustrative) : réservoirs, pompes, entrepôts. Tout détruire ; flak moyenne.\nPosition : bullseye 086°/52 nm (N49°08.700' E000°13.800'). Base amie la plus proche : Beny-sur-Mer, à 27 nm."
      - type: zone
        zone_name: combatZone_Triqueville
        friendly_name: Z13 OCA — base aérienne de Triqueville
        radio_group_name: Bases aériennes
        training: false
        briefing: "La base aérienne de Triqueville, au sud de l'estuaire de la Seine : chasseurs au parking, hangars et carburant. Tout détruire au sol ; flak moyenne et lourde, sous la QRA de la Seine.\nPosition : bullseye 076°/63 nm (N49°20.158' E000°27.991'). Base amie la plus proche : Beny-sur-Mer, à 35 nm."
      - type: zone
        zone_name: combatZone_BeaumontLeRoger
        friendly_name: Z14 OCA — base aérienne de Beaumont-le-Roger
        radio_group_name: Bases aériennes
        training: false
        briefing: "La base aérienne de Beaumont-le-Roger, à l'arrière du front : bombardiers et chasseurs au parking, hangars et carburant. Tout détruire au sol ; flak moyenne et lourde.\nPosition : bullseye 089°/75 nm (N49°05.767' E000°48.308'). Base amie la plus proche : Beny-sur-Mer, à 50 nm."
      - type: zone
        zone_name: combatZone_VedettesLeHavre
        friendly_name: Z15 Antinavire — vedettes lance-torpilles du Havre
        radio_group_name: Antinavire
        training: false
        briefing: "Les vedettes lance-torpilles (S-boote) basées au Havre, qui sortent attaquer les convois de la Manche, et la batterie côtière du cap de la Hève. Couler les vedettes ; flak de bord et batterie côtière (portée de 20 km environ pour les canons, sans menace pour les avions).\nPosition : bullseye 058°/50 nm (N49°31.800' E000°00.600'). Base amie la plus proche : Beny-sur-Mer, à 22 nm."
      - type: zone
        zone_name: combatZone_ConvoiCotier
        friendly_name: Z16 Antinavire — convoi côtier vers Dieppe
        radio_group_name: Antinavire
        training: false
        briefing: "Un convoi de cargos escortés longe la côte du Havre vers Dieppe, avec deux vedettes lance-torpilles. Couler les cargos ; flak de bord sur les escorteurs.\nPosition : bullseye 047°/72 nm (N49°54.000' E000°18.000'). Base amie la plus proche : Beny-sur-Mer, à 46 nm."
cap_missions:
  - group_name: CAP-Caen-Bf109
    menu_name: CAP rouge Bf 109 K-4 — sud de Caen — 15 000 ft
    briefing: Deux Bf 109 K-4 patrouillent au sud de Caen, entre Falaise et Lisieux, à 15 000 ft. Canons et mitrailleuses seulement.
  - group_name: CAP-Cotentin-Fw190
    menu_name: CAP rouge Fw 190 A-8 — Cotentin sud — 12 000 ft
    briefing: Deux Fw 190 A-8 patrouillent au sud du front du Cotentin, entre Coutances et Saint-Lô, à 12 000 ft. Canons seulement.
  - group_name: CAP-Seine-Fw190D9
    menu_name: CAP rouge Fw 190 D-9 — vallée de la Seine — 22 000 ft
    briefing: Deux Fw 190 D-9, le chasseur le plus performant du camp rouge, patrouillent haut au-dessus de la Seine, entre Pont-Audemer et Rouen, à 22 000 ft. Canons seulement.
  - group_name: Raid-Ju88
    menu_name: Raid rouge Ju 88 A-4 à intercepter — baie de Seine — 12 000 ft
    briefing: 'Quatre bombardiers Ju 88 A-4 tournent au-dessus de la baie de Seine, à 12 000 ft, prêts à frapper les plages : les intercepter. Armement défensif seulement tiré par les mitrailleurs.'
  - group_name: CAP-TetedePont-P51D
    menu_name: CAP bleue P-51D — tête de pont — 15 000 ft
    briefing: Deux P-51D patrouillent au large de la tête de pont, de Port-en-Bessin à Ouistreham, à 15 000 ft. Canons seulement.
  - group_name: CAP-Cotentin-Spitfire
    menu_name: CAP bleue Spitfire LF IX — Cotentin — 12 000 ft
    briefing: Deux Spitfire LF Mk IX patrouillent au nord du Cotentin, de Cherbourg à Saint-Vaast, à 12 000 ft. Canons seulement.
pipeline: # pas de variantes météo (le serveur VEAF fixe météo et heure, David 12/10/2026) ; pas de catalogue d'avions à faire apparaître : il ne contient que des jets (aucun appareil de 1944)
  weather: false
  spawnable_aircrafts: false
profiles:
  LOCAL_TEST:
    global_log_level: debug
    security:
      disabled: true
    mission:
      hide_names_from_spawned_groups: false
combat_missions:
  - name: Defense-Mulberry
    friendly_name: Défense — raid de Ju 88 sur le port artificiel d'Arromanches
    secured: false
    briefing: "Six Ju 88 A-4 chargés de bombes, escortés de quatre Fw 190 A-8, partent de l'estuaire de la Seine vers le port artificiel d'Arromanches. Abattez les bombardiers avant le largage.\nÉchec si le port est bombardé (constaté par vous : la mission ne le vérifie pas)."
    elements:
      - name: Bombardiers
        groups:
          - SC-Raid-Mulberry-Bombers
        scalable: false
      - name: Escorte
        groups:
          - SC-Raid-Mulberry-Escort
        scalable: true
  - name: Escorte-B17
    friendly_name: Escorte — six B-17G sur les triages de Rouen
    secured: false
    briefing: "Six B-17G décollés d'Angleterre vont bombarder la gare de triage de Rouen, par la Manche et la basse Seine. Des Fw 190 A-8 et des Bf 109 K-4 les attendent au-dessus de la Seine : escortez-les, de la côte à la cible.\nÉchec si un bombardier est abattu (constaté par vous : la mission ne le vérifie pas)."
    elements:
      - name: Bombardiers
        groups:
          - SC-Escort-B17
        scalable: false
      - name: Chasseurs rouges
        groups:
          - SC-Escort-B17-Interceptors
          - SC-Escort-B17-Interceptors-Bf109
        scalable: true
  - name: Interception-Reco
    friendly_name: Interception — Ju 88 de reconnaissance sur la tête de pont
    secured: false
    briefing: "Un Ju 88 A-4 de reconnaissance, escorté de deux Bf 109 K-4, survole la tête de pont à 22 000 ft pour photographier les plages. Interceptez-le avant qu'il ne rentre : sa route passe au large de Courseulles, de Bayeux puis du Cotentin."
    elements:
      - name: Reconnaissance
        groups:
          - SC-Recce-Ju88
        scalable: false
      - name: Escorte
        groups:
          - SC-Recce-Escort
        scalable: true
